plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vegacitizen.chomprex'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vegacitizen.chomprex'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // 빌드할 때마다 서명이 바뀌면 폰에서 덮어쓰기 설치가 안 되므로, 저장소에 둔 고정 디버그 키로 서명한다
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
