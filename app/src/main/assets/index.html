<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ChompRex</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d6fa5;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
    text-shadow:0 2px 3px rgba(0,0,0,.65)}
  #hudL{float:left}
  #hudR{float:right;text-align:right}
  #species{font-size:20px;font-weight:800}
  #weight{font-size:15px;font-weight:600;opacity:.95}
  #goal{width:150px;height:7px;border-radius:4px;background:rgba(0,0,0,.35);margin-top:5px;overflow:hidden}
  #goalFill{height:100%;width:0;background:#ffd54a}
  #count,#best{font-size:15px;font-weight:600}
  #mid{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);
    width:min(46vw,300px);text-align:center}
  #powerWrap{display:none}
  #powerLabel{font-size:14px;font-weight:800;color:#bff6ff}
  #powerBar{height:10px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:3px}
  #powerFill{height:100%;width:100%;background:linear-gradient(90deg,#4de8ff,#c58bff)}
  #combo{font-size:19px;font-weight:900;color:#ffb347;margin-top:4px;display:none}
  #hide{font-size:14px;font-weight:800;color:#b9ffb0;margin-top:4px;display:none}
  #toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:26px;font-weight:900;
    color:#ffe066;opacity:0;transition:opacity .35s;white-space:nowrap}
  #dash{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));
    width:88px;height:88px;border-radius:50%;display:none;align-items:center;justify-content:center;
    pointer-events:auto;touch-action:none;background:conic-gradient(#ffb52e 100%,rgba(0,0,0,.4) 0)}
  #dash span{width:70px;height:70px;border-radius:50%;background:rgba(40,30,10,.78);display:flex;align-items:center;
    justify-content:center;font-size:17px;font-weight:900;color:#ffe0a0}
  #dash.on span{background:rgba(255,181,46,.85);color:#3a2200}
  #items{position:fixed;right:calc(max(22px,env(safe-area-inset-right)) + 100px);bottom:max(26px,env(safe-area-inset-bottom));
    display:none;gap:8px;pointer-events:none}
  .item{width:58px;height:58px;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(#7fe0a0 100%,rgba(0,0,0,.45) 0)}
  .item span{width:48px;height:48px;border-radius:50%;background:rgba(18,44,30,.86);display:flex;flex-direction:column;align-items:center;
    justify-content:center;line-height:1.15}
  .item b{font-size:11px;font-weight:900;color:#eaffea;white-space:nowrap;letter-spacing:-1px}
  .item i{font-size:9.5px;font-style:normal;font-weight:700;color:#ffd0a0}
  .item.lock{background:rgba(0,0,0,.4)}
  .item.lock span{background:rgba(40,40,40,.7)}
  .item.lock b{color:#9a9a9a}.item.lock i{color:#bdbdbd}
  .item:active span{background:rgba(127,224,160,.8)}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,24,14,.62);padding:12px;box-sizing:border-box}
  #panel{max-width:560px;width:100%;max-height:100%;overflow:auto;background:rgba(20,48,28,.92);
    border:2px solid #9bd66b;border-radius:18px;padding:14px 22px;box-sizing:border-box;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #panel h1{margin:0 0 2px;font-size:30px;letter-spacing:1px;color:#ffe066}
  #panel h2{margin:0 0 6px;font-size:14px;font-weight:600;opacity:.9}
  #panel ul{margin:6px 0 12px;padding-left:20px;text-align:left;font-size:13.5px;line-height:1.5}
  #panel .res{font-size:17px;line-height:1.6;margin:8px 0 14px}
  .g{color:#9dff8a;font-weight:700}.r{color:#ff8a7a;font-weight:700}.c{color:#7fe9ff;font-weight:700}.o{color:#ffc46b;font-weight:700}
  #btn{pointer-events:auto;border:0;border-radius:14px;background:#ffb52e;color:#3a2200;font-size:20px;
    font-weight:900;padding:11px 38px;box-shadow:0 5px 0 #b06f00;font-family:inherit}
  #btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b06f00}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hudL">
    <div id="species"></div>
    <div id="weight"></div>
    <div id="goal"><div id="goalFill"></div></div>
  </div>
  <div id="hudR">
    <div id="count"></div>
    <div id="best"></div>
  </div>
  <div id="mid">
    <div id="powerWrap">
      <div id="powerLabel">거대화!</div>
      <div id="powerBar"><div id="powerFill"></div></div>
    </div>
    <div id="combo"></div>
    <div id="hide">🌿 덤불에 은신 중</div>
  </div>
  <div id="toast"></div>
</div>
<div id="items"></div>
<div id="dash"><span>돌진</span></div>
<div id="overlay"><div id="panel"></div></div>

<script>
'use strict';
/* ===================== 설정 ===================== */
const WORLD = 10000;          // 맵 한 변 길이
const BASE_R = 18;            // 시작 반지름
const BASE_KG = 3;            // 시작 몸무게(kg)
const WIN_KG = 20000;         // 승리 몸무게
const EAT_RATIO = 1.08;       // 내 크기의 이 배수 이하까지 "비슷한 크기"로 보고 먹을 수 있음
const GIANT_MAX = 10;         // 마법의 돌: 가장 작은 공룡의 몸 크기 배수
const GIANT_MIN = 1.5;        // 마법의 돌: 가장 큰 공룡의 몸 크기 배수
// 아이템: 몸무게가 unlock(kg) 이상이면 열리고, 쓸 때마다 현재 몸무게의 cost 비율을 소모한다
const ITEMS = [
  {id: 'fire',  name: '불쏘기',   unlock: 12,  cost: 0.04, cd: 1.2},
  {id: 'net',   name: '그물',     unlock: 30,  cost: 0.06, cd: 3},
  {id: 'bait',  name: '미끼',     unlock: 60,  cost: 0.03, cd: 4},
  {id: 'roar',  name: '포효',     unlock: 150, cost: 0.05, cd: 5},
  {id: 'armor', name: '가시갑옷', unlock: 300, cost: 0.08, cd: 8}
];
const FIRE_SHRINK = 0.7, NET_TIME = 4.5, FEAR_TIME = 3.5, ARMOR_TIME = 6, BAIT_TIME = 6;
const GIANT_SPEED = 1.5;      // 마법의 돌: 속도 배수
const GIANT_TIME = 8;         // 플레이어 거대화 지속(초)
const NPC_GIANT_TIME = 6;     // 다른 공룡 거대화 지속(초)
const COMBO_WINDOW = 3.5;     // 콤보 유지 시간(초)
const NPC_TARGET = 40;        // 주변 공룡 수
const EGG_TARGET = 20, BUSH_TARGET = 5;
const TIERS = [
  [0, '콤프소그나투스'], [12, '벨로시랩터'], [60, '데이노니쿠스'], [300, '딜로포사우루스'],
  [900, '케라토사우루스'], [2200, '알로사우루스'], [7000, '티라노사우루스']
];
const TIER_COLS = ['#e8552d', '#e8702d', '#e04848', '#d2406a', '#c2452f', '#b0344f', '#9c2a2a'];
const KINDS = [
  {k:'raptor', min:0,  cols:['#c9a24b','#b5793a','#8f9a4a','#a8b56b']},
  {k:'para',   min:14, cols:['#5fa8a0','#7d9bd1','#6fb58a']},
  {k:'trike',  min:16, cols:['#b98a5e','#9c7b6a','#c7a36b']},
  {k:'stego',  min:18, cols:['#7f9a52','#8a8f5a','#a3955a']},
  {k:'ankylo', min:16, cols:['#8c7a66','#77808a','#9a8a5c']},
  {k:'sauro',  min:30, cols:['#6f8fae','#8aa07a','#9a8fb0']}
];
// 종류별 입 위치(단위 좌표)
const MOUTH = {rex:[1.45,-0.58], raptor:[1.3,-0.6], para:[1.3,-0.6], trike:[1.5,0.12], stego:[1.42,0.24], ankylo:[1.42,0.24], sauro:[1.62,-1.52]};

/* ===================== 유틸 ===================== */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const kgOf = r => BASE_KG * Math.pow(r / BASE_R, 3);
const speedOf = r => 170 * Math.pow(r / BASE_R, 0.6);
const ER = e => e.r * e.gm;                    // 현재 보이는(거대화 반영) 반지름
function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = clamp((n & 255) * f, 0, 255) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function fmtKg(kg) {
  if (kg >= 1000) return (kg / 1000).toFixed(kg >= 10000 ? 1 : 2) + ' t';
  if (kg >= 10) return Math.round(kg) + ' kg';
  return kg.toFixed(1) + ' kg';
}
function tierOf(kg) { let t = 0; for (let i = 0; i < TIERS.length; i++) if (kg >= TIERS[i][0]) t = i; return t; }

/* ===================== 캔버스 ===================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); resize();

/* ===================== 사운드 ===================== */
let ac = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
}
function beep(f0, f1, dur, type, vol) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

/* ===================== 게임 상태 ===================== */
let state = 'menu';           // menu | play | dead | win
let player, npcs, ores, eggs, bushes, meteors, parts, texts, rings, shots, baits;
let itemCd = ITEMS.map(() => 0), itemSeen = ITEMS.map(() => false);
let cam = {x: WORLD / 2, y: WORLD / 2, scale: 1, shake: 0};
let eaten = 0, oreTimer = 0, meteorTimer = 0, time = 0, curTier = 0;
let combo = 0, comboT = 0, stamina = 1, dashing = false, hidden = false, scared = false, deathWhy = '';
let best = 0;
try { best = parseFloat(localStorage.getItem('chomprex_best')) || 0; } catch (e) {}

function newGame() {
  player = {x: WORLD / 2, y: WORLD / 2, r: BASE_R, gm: 1, gmax: 1, giantT: 0, aim: 0, shieldT: 0, eating: null, ang: 0, spd: 0, sharp: 0, lean: 0, pop: 0, happyT: 0, stepS: false, bl: 0, face: 1, phase: 0,
            mouth: 0, chomp: 0, age: 9, kind: 'rex', col: TIER_COLS[0], dark: shade(TIER_COLS[0], 0.68)};
  npcs = []; ores = []; eggs = []; bushes = []; meteors = []; parts = []; texts = []; rings = []; shots = []; baits = [];
  itemCd = ITEMS.map(() => 0); itemSeen = ITEMS.map(() => false);
  eaten = 0; oreTimer = 4; meteorTimer = rnd(16, 24); time = 0; curTier = 0;
  combo = 0; comboT = 0; stamina = 1; dashing = false; hidden = false; deathWhy = '';
  cam.x = player.x; cam.y = player.y; cam.scale = Math.min(W, H) / (player.r * 17); cam.shake = 0;
  for (let i = 0; i < NPC_TARGET; i++) spawnNpc(true);
  for (let i = 0; i < EGG_TARGET; i++) spawnEgg(true);
  for (let i = 0; i < BUSH_TARGET; i++) spawnBush(true);
}
const viewR = () => Math.hypot(W, H) / 2 / cam.scale;
const canEat = n => ER(n) <= ER(player) * EAT_RATIO;
const inWorld = (x, y, m) => x > m && y > m && x < WORLD - m && y < WORLD - m;

// 플레이어 주변 고리 모양 영역에서 맵 안쪽 좌표를 고른다
function ringPos(d0, d1, m) {
  for (let t = 0; t < 12; t++) {
    const a = rnd(0, 6.28), d = rnd(d0, d1);
    const x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
    if (inWorld(x, y, m)) return {x, y};
  }
  return null;
}
function spawnNpc(initial) {
  const vr = viewR(), giant = player.giantT > 0;
  // 크기 분포: 대부분 먹잇감, 일부는 비슷한 크기, 일부는 위험한 큰 공룡
  const u = Math.random();
  const f = u < 0.64 ? rnd(0.32, 0.92) : u < 0.76 ? rnd(0.95, 1.07) : rnd(1.22, 2.3);
  const r = Math.max(8, player.r * f);
  const pos = initial ? ringPos(player.r * (f > 1.08 ? 13 : 6), vr * 2.2, r)
            : giant ? ringPos(vr * 0.7, vr * 1.3, r) : ringPos(vr * 1.08, vr * 2.1, r);
  if (!pos) return;
  const opts = KINDS.filter(k => r >= k.min);
  const kd = opts[(Math.random() * opts.length) | 0];
  const col = kd.cols[(Math.random() * kd.cols.length) | 0];
  npcs.push({x: pos.x, y: pos.y, r, gm: 1, gmax: 1, giantT: 0, netT: 0, fearT: 0, burnT: 0, eating: null, kind: kd.k, col, dark: shade(col, 0.7),
             ang: rnd(0, 6.28), spd: 0, sharp: 0, lean: 0, pop: 0, happyT: 0, stepS: false, bl: rnd(0, 3), face: 1, phase: rnd(0, 6), mouth: 0, age: initial ? 9 : 0,
             wt: 0, wa: rnd(0, 6.28), aggro: Math.random() < 0.65, greedy: Math.random() < 0.6, chaseT: 0, rest: 0, mode: 0});
}
function spawnEgg(initial) {
  const vr = viewR(), r = player.r * rnd(0.3, 0.4);
  const pos = initial ? ringPos(player.r * 3, vr * 2.2, r) : ringPos(vr * 1.05, vr * 2.2, r);
  if (pos) eggs.push({x: pos.x, y: pos.y, r, col: ['#f4ecd6', '#e8f0d0', '#f3dcc0'][(Math.random() * 3) | 0], rot: rnd(-0.4, 0.4)});
}
function spawnBush(initial) {
  const vr = viewR(), r = player.r * rnd(3.2, 4.6);
  const pos = initial ? ringPos(player.r * 8, vr * 2.2, r) : ringPos(vr * 1.1 + r, vr * 2.6, r);
  if (pos) bushes.push({x: pos.x, y: pos.y, r, seed: (Math.random() * 1e6) | 0});
}
// 마법의 돌: 화면 안 임의의 위치에 생겼다가 일정 시간 뒤 사라진다
function spawnOre(x, y) {
  if (x === undefined) {
    for (let t = 0; t < 14; t++) {
      x = cam.x + rnd(-0.44, 0.44) * W / cam.scale; y = cam.y + rnd(-0.4, 0.4) * H / cam.scale;
      if (inWorld(x, y, 40) && Math.hypot(x - player.x, y - player.y) > ER(player) * 3) break;
    }
    if (!inWorld(x, y, 40)) return;
  }
  ores.push({x, y, r: Math.max(11, player.r * 0.55), t: 0, life: rnd(9, 14)});
}
// 운석: 경고 표시 후 떨어져 범위 안의 공룡을 쓸어버리고 마법의 돌을 남긴다
function spawnMeteor(x, y) {
  const R = player.r * 4.5;
  if (x === undefined) {
    if (Math.random() < 0.35) { x = player.x + rnd(-3, 3) * player.r; y = player.y + rnd(-3, 3) * player.r; }
    else { x = cam.x + rnd(-0.4, 0.4) * W / cam.scale; y = cam.y + rnd(-0.35, 0.35) * H / cam.scale; }
  }
  x = clamp(x, R, WORLD - R); y = clamp(y, R, WORLD - R);
  meteors.push({x, y, R, t: 2.4, max: 2.4});
  toast('운석 낙하! 피하세요!'); beep(900, 300, 0.5, 'sawtooth', 0.06);
}
function burst(x, y, r, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(1.5, 5) * r;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(0.08, 0.2) * r, life: rnd(0.3, 0.6), max: 0.6, col});
  }
}
// 거대화 배율: 지금 맵에 있는 공룡 중 가장 작으면 10배, 가장 크면 1.5배, 그 사이는 크기에 비례
function giantMul(e) {
  let lo = player.r, hi = player.r;
  for (const n of npcs) { if (n.r < lo) lo = n.r; if (n.r > hi) hi = n.r; }
  if (hi - lo < 1e-6) return GIANT_MAX;
  return GIANT_MAX + (GIANT_MIN - GIANT_MAX) * clamp((e.r - lo) / (hi - lo), 0, 1);
}
function grow(e, preyR) { e.r = Math.cbrt(e.r * e.r * e.r + preyR * preyR * preyR); }  // 먹은 만큼 몸무게가 더해짐
function mouthOf(e) { const m = MOUTH[e.kind], s = ER(e); return {x: e.x + e.face * m[0] * s, y: e.y + m[1] * s}; }

/* ===================== 움직임(관성) ===================== */
// 몸집이 클수록: 방향 전환이 느리고, 출발 속도가 낮고, 최고 속도까지 오래 걸린다 (최고 속도 자체는 speedOf 로 더 높다)
function agility(e) {
  const s = Math.log2(Math.max(1, ER(e) / BASE_R));
  return {turn: 9 / (1 + 0.65 * s),               // 초당 회전 가능 각도(rad)
          tAcc: 0.22 + 0.2 * s,                   // 정지 → 최고 속도까지 걸리는 시간(초)
          start: Math.max(0.1, 0.6 - 0.12 * s)};  // 출발 순간 속도(최고 속도 대비 비율)
}
// e.ang(진행 방향), e.spd(속력)를 want 방향·top 속도를 향해 갱신한다. 급하게 꺾을수록 속도를 잃고 흙먼지가 크게 인다.
function steer(e, want, mag, top, ref, dt, turnMul, fx) {
  const A = agility(e), acc = Math.max(top, ref * 0.5) / A.tAcc;
  if (mag < 0.05) {
    if (fx && e.spd > ref * 0.45 && Math.random() < dt * 30) dust(e, 0.3, 1);
    e.spd = Math.max(0, e.spd - acc * 2.2 * dt); e.sharp = e.spd > ref * 0.3 ? 0.4 : 0; return;
  }   // 입력이 없으면 미끄러지며 멈춤
  let da = want - e.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
  const ad = Math.abs(da), frac = Math.min(1, e.spd / ref);
  const sharp = clamp((ad - 0.45) / 2.2, 0, 1);                       // 0 = 완만, 1 = 정반대로 꺾음
  if (e.spd < ref * 0.06) e.ang = want;                               // 서 있을 때는 제자리에서 바로 돌아섬
  else { const rate = A.turn * (1.6 - 0.9 * frac) * turnMul; e.ang += clamp(da, -rate * dt, rate * dt); }   // 빠를수록 관성 때문에 덜 꺾임
  const target = top * mag * (1 - 0.8 * sharp);                       // 급회전 중에는 속도를 줄여야 함
  if (e.spd < target) {
    const kick = A.start * target;

/* ===================== 그리기: 배경 ===================== */
const LAYERS = [{cell: 2200, p: 0.55, s: 3}, {cell: 700, p: 0.5, s: 2}, {cell: 220, p: 0.45, s: 1}, {cell: 70, p: 0.4, s: 0}];
function drawDecor() {
  const x0 = cam.x - W / 2 / cam.scale, y0 = cam.y - H / 2 / cam.scale, x1 = cam.x + W / 2 / cam.scale, y1 = cam.y + H / 2 / cam.scale;

    const ja = Math.max(0, Math.floor(y0 / L.cell) - 1), jb = Math.min(Math.floor(WORLD / L.cell) - 1, Math.floor(y1 / L.cell) + 1);
    for (let j = ja; j <= jb; j++) for (let i = ia; i <= ib; i++) {
      const h = hash(i, j, L.s);
      if (h > L.p) continue;
      const wx = (i + 0.2 + hash(i, j, L.s + 10) * 0.6) * L.cell, wy = (j + 0.2 + hash(i, j, L.s + 20) * 0.6) * L.cell;
      const sx = (wx - cam.x) * cam.scale + W / 2, sy = (wy - cam.y) * cam.scale + H / 2, u = px * (0.16 + h / L.p * 0.1);
      if (L.s === 3) {                      // 흙바닥 공터
        ctx.fillStyle = '#86b866'; ctx.beginPath(); ctx.ellipse(sx, sy, u * 1.9, u * 1.15, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#c2b27a'; ctx.beginPath(); ctx.ellipse(sx, sy, u * 1.6, u * 0.92, 0, 0, 6.2832); ctx.fill();
      } else if (L.s === 2) {

          ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(sx, sy + u * 0.9, u * 0.9, u * 0.3, 0, 0, 6.2832); ctx.fill();
          ctx.fillStyle = '#6b4a2b'; ctx.fillRect(sx - u * 0.12, sy, u * 0.24, u * 0.9);
          ctx.fillStyle = '#2f7a3a'; ctx.beginPath(); ctx.arc(sx, sy - u * 0.2, u * 0.75, 0, 6.2832); ctx.fill();
          ctx.fillStyle = '#3e9447'; ctx.beginPath(); ctx.arc(sx - u * 0.2, sy - u * 0.4, u * 0.45, 0, 6.2832); ctx.fill();
        } else {                            // 바위

          ctx.fillStyle = '#a5a9a0'; ctx.beginPath(); ctx.moveTo(sx - u * 0.5, sy - u * 0.5); ctx.lineTo(sx + u * 0.4, sy - u * 0.6); ctx.lineTo(sx, sy + u * 0.1); ctx.fill();

function drawOre(o) {

/* ===================== 렌더 ===================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1d6fa5'; ctx.fillRect(0, 0, W, H);                       // 바다
  ctx.save();
  if (cam.shake > 0) ctx.translate(rnd(-1, 1) * cam.shake * 24, rnd(-1, 1) * cam.shake * 24);
  const lx = SX(0), ly = SY(0), ls = WORLD * cam.scale, b = 60 * cam.scale + 6;
  ctx.fillStyle = '#e2cf93'; ctx.fillRect(lx - b, ly - b, ls + b * 2, ls + b * 2);  // 모래사장
  ctx.fillStyle = '#7bb661'; ctx.fillRect(lx, ly, ls, ls);                    // 초원
  drawDecor();
  for (const m of meteors) drawMeteor(m, false);
  for (const g of eggs) drawEgg(g);
  for (const bt of baits) drawBait(bt);
  let oreSeen = false;
  for (const o of ores) if (drawOre(o)) oreSeen = true;

  const list = npcs.slice();
  if (state !== 'dead') list.push(player);
  list.sort((a, c) => (a.y + ER(a)) - (c.y + ER(c)));
  for (const e of list) drawEntity(e, e === player);
  for (const bu of bushes) drawBush(bu);
  for (const q of shots) drawShot(q);

  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1) * (q.dust ? 0.6 : 1); ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc(SX(q.x), SY(q.y), Math.max(1, q.r * cam.scale), 0, 6.2832); ctx.fill();
  }
  for (const q of rings) {
    const k = 1 - q.life / q.max, rr = (q.r0 + (q.r1 - q.r0) * (1 - (1 - k) * (1 - k))) * cam.scale;
    ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = q.col; ctx.lineWidth = Math.max(2, rr * 0.08 * (1 - k) + 1.5);
    ctx.beginPath(); ctx.ellipse(SX(q.x), SY(q.y), rr, rr * 0.8, 0, 0, 6.2832); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const m of meteors) drawMeteor(m, true);
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life * 2, 0, 1);
    ctx.font = '800 ' + (t.big ? 22 : 16) + 'px sans-serif';
    const x = SX(t.x), y = SY(t.y);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.s, x, y);
    ctx.fillStyle = t.col || (t.big ? '#ffc46b' : '#fff7b0'); ctx.fillText(t.s, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play') {
    // 화면 밖 마법의 돌 방향 표시
    if (!oreSeen && ores.length && player.giantT <= 0) {
      let o = ores[0]; for (const q of ores) if (Math.hypot(q.x - player.x, q.y - player.y) < Math.hypot(o.x - player.x, o.y - player.y)) o = q;
      const a = Math.atan2(o.y - player.y, o.x - player.x), m = 34;
      const k = Math.min((W / 2 - m) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - m) / Math.abs(Math.sin(a) || 1e-6));
      const x = W / 2 + Math.cos(a) * k, y = H / 2 + Math.sin(a) * k, pu = 1 + Math.sin(time * 6) * 0.15;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(pu, pu);
      ctx.fillStyle = 'rgba(80,230,255,.95)'; ctx.strokeStyle = 'rgba(0,40,70,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -10); ctx.lineTo(-1, 0); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // 가상 조이스틱
    if (input.id !== -1) {
      ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(input.ox, input.oy, 56, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(input.ox + input.dx * 56, input.oy + input.dy * 56, 24, 0, 6.2832); ctx.fill();
    }
  }
}

  $('items').style.display = state === 'play' ? 'flex' : 'none';
  for (let i = 0; i < ITEMS.length; i++) {
    const it = ITEMS[i], el = itemEls[i], lock = kg < it.unlock;
    el.className = lock ? 'item lock' : 'item';
    el.lastChild.lastChild.textContent = lock ? fmtKg(it.unlock) : '-' + Math.round(it.cost * 100) + '%';
    el.style.background = lock ? '' : 'conic-gradient(#7fe0a0 ' + ((1 - itemCd[i] / it.cd) * 100) + '%,rgba(0,0,0,.45) 0)';
  }
}
function showPanel(kind) {
  const kg = player ? kgOf(player.r) : 0;
  let h;
  if (kind === 'menu') {
    h = '<h1>🦖 ChompRex</h1><h2>먹고, 자라고, 최강의 공룡이 되자!</h2><ul>' +
        '<li>화면을 <b>드래그</b>해서 움직이고, <span class="o">돌진</span> 버튼으로 잠깐 빨리 달립니다. 몸집이 클수록 최고 속도는 빠르지만 출발과 방향 전환이 굼뜹니다.</li>' +
        '<li><span class="g">작거나 비슷한 공룡(초록)</span>을 물면 뜯어먹습니다. 큰 먹잇감일수록 오래 걸리고, 먹는 동안은 느려집니다.</li>' +
        '<li><span class="r">큰 공룡(빨강 !)</span>은 피하세요. <b>덤불</b>에 숨으면 들키지 않습니다.</li>' +
        '<li><span class="c">마법의 돌 ◆</span>을 먹으면 잠시 몸이 ' + GIANT_MIN + '~' + GIANT_MAX + '배(작은 공룡일수록 크게), 속도가 ' + GIANT_SPEED + '배! 다른 공룡이 먼저 먹으면 그 공룡이 거대해집니다.</li>' +
        '<li>연속으로 잡아먹으면 <span class="o">콤보</span> 보너스. 알은 간식, <span class="r">운석</span>은 피하세요.</li>' +
        '<li>몸무게가 늘면 <span class="g">아이템</span>(불쏘기·그물·미끼·포효·가시갑옷)이 열립니다. 쓸 때마다 몸무게를 조금 소모합니다.</li>' +
        '<li>몸무게 ' + fmtKg(WIN_KG) + '의 대왕 티라노사우루스가 되면 승리!</li></ul>' +
        '<button id="btn">게임 시작</button>';
  } else if (kind === 'dead') {
    h = '<h1>' + (deathWhy === 'meteor' ? '운석에 맞았다!' : '잡아먹혔다!') + '</h1><div class="res">' + TIERS[tierOf(kg)][1] + ' · <b>' + fmtKg(kg) +
        '</b><br>잡아먹은 공룡 ' + eaten + '마리<br>최고 기록 ' + fmtKg(best) + '</div><button id="btn">다시 도전</button>';
  } else {
    h = '<h1>👑 공룡의 왕!</h1><div class="res">몸무게 <b>' + fmtKg(kg) + '</b>의 대왕 티라노사우루스가 되었습니다.<br>잡아먹은 공룡 ' + eaten +
        '마리 · ' + Math.round(time) + '초</div><button id="btn">다시 하기</button>';
  }
  $('panel').innerHTML = h;
  $('overlay').style.display = 'flex';
  $('btn').addEventListener('click', () => { initAudio(); $('overlay').style.display = 'none'; newGame(); state = 'play'; });
}

/* ===================== 루프 ===================== */
let last = 0, hudTick = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt);
  render();
  if (++hudTick % 4 === 0) updateHud();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });
newGame();
showPanel('menu');
updateHud();
requestAnimationFrame(frame);
window.__game = {get state() { return state; }, get player() { return player; }, get npcs() { return npcs; }, get ores() { return ores; },
  get eggs() { return eggs; }, get bushes() { return bushes; }, get meteors() { return meteors; }, get combo() { return combo; },
  get stamina() { return stamina; }, get hidden() { return hidden; }, get scared() { return scared; }, get why() { return deathWhy; },
  set meteorTimer(v) { meteorTimer = v; }, set oreTimer(v) { oreTimer = v; }, set dash(v) { dashHeld = v; },
  get shots() { return shots; }, get baits() { return baits; }, get itemCd() { return itemCd; },
  input, kgOf, ER, speedOf, agility, spawnOre, spawnMeteor, canEat, useItem, giantMul, ITEMS};
</script>
