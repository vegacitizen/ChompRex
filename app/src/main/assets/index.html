<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ChompRex</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d6fa5;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
    text-shadow:0 2px 3px rgba(0,0,0,.65)}
  #hud .l{position:absolute;left:inherit;top:inherit}
  #hudL{float:left}
  #hudR{float:right;text-align:right}
  #species{font-size:20px;font-weight:800}
  #weight{font-size:15px;font-weight:600;opacity:.95}
  #goal{width:150px;height:7px;border-radius:4px;background:rgba(0,0,0,.35);margin-top:5px;overflow:hidden}
  #goalFill{height:100%;width:0;background:#ffd54a}
  #count,#best{font-size:15px;font-weight:600}
  #powerWrap{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);
    width:min(46vw,300px);text-align:center;display:none}
  #powerLabel{font-size:14px;font-weight:800;color:#bff6ff}
  #powerBar{height:10px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:3px}
  #powerFill{height:100%;width:100%;background:linear-gradient(90deg,#4de8ff,#c58bff)}
  #toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:26px;font-weight:900;
    color:#ffe066;opacity:0;transition:opacity .35s;white-space:nowrap}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,24,14,.62);padding:16px;box-sizing:border-box}
  #panel{max-width:520px;width:100%;max-height:100%;overflow:auto;background:rgba(20,48,28,.92);
    border:2px solid #9bd66b;border-radius:18px;padding:18px 22px;box-sizing:border-box;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #panel h1{margin:0 0 4px;font-size:34px;letter-spacing:1px;color:#ffe066}
  #panel h2{margin:0 0 10px;font-size:15px;font-weight:600;opacity:.9}
  #panel ul{margin:10px 0 14px;padding-left:20px;text-align:left;font-size:14px;line-height:1.55}
  #panel .res{font-size:17px;line-height:1.6;margin:8px 0 14px}
  .g{color:#9dff8a;font-weight:700}.r{color:#ff8a7a;font-weight:700}.c{color:#7fe9ff;font-weight:700}
  #btn{pointer-events:auto;border:0;border-radius:14px;background:#ffb52e;color:#3a2200;font-size:20px;
    font-weight:900;padding:12px 38px;box-shadow:0 5px 0 #b06f00;font-family:inherit}
  #btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b06f00}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="hudL">
    <div id="species"></div>
    <div id="weight"></div>
    <div id="goal"><div id="goalFill"></div></div>
  </div>
  <div id="hudR">
    <div id="count"></div>
    <div id="best"></div>
  </div>
  <div id="powerWrap">
    <div id="powerLabel">신비의 광석 파워!</div>
    <div id="powerBar"><div id="powerFill"></div></div>
  </div>
  <div id="toast"></div>
</div>
<div id="overlay"><div id="panel"></div></div>

<script>
'use strict';
/* ===================== 설정 ===================== */
const WORLD = 10000;          // 맵 한 변 길이
const BASE_R = 18;            // 시작 반지름
const BASE_KG = 3;            // 시작 몸무게(kg)
const WIN_KG = 20000;         // 승리 몸무게
const EAT_RATIO = 1.08;       // 내 크기의 이 배수 이하까지 "비슷한 크기"로 보고 먹을 수 있음
const POWER_TIME = 8;         // 광석 효과 지속(초)
const NPC_TARGET = 40;        // 주변 공룡 수
const TIERS = [
  [0, '콤프소그나투스'], [12, '벨로시랩터'], [60, '데이노니쿠스'], [300, '딜로포사우루스'],
  [900, '케라토사우루스'], [2200, '알로사우루스'], [7000, '티라노사우루스']
];
const KINDS = [
  {k:'raptor', min:0,  cols:['#c9a24b','#b5793a','#8f9a4a','#a8b56b']},
  {k:'para',   min:14, cols:['#5fa8a0','#7d9bd1','#6fb58a']},
  {k:'trike',  min:16, cols:['#b98a5e','#9c7b6a','#c7a36b']},
  {k:'stego',  min:18, cols:['#7f9a52','#8a8f5a','#a3955a']},
  {k:'ankylo', min:16, cols:['#8c7a66','#77808a','#9a8a5c']},
  {k:'sauro',  min:30, cols:['#6f8fae','#8aa07a','#9a8fb0']}
];

/* ===================== 유틸 ===================== */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const kgOf = r => BASE_KG * Math.pow(r / BASE_R, 3);
const speedOf = r => 170 * Math.pow(r / BASE_R, 0.6);
function hash(x, y, s) {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) * f, 0, 255) | 0, g = clamp(((n >> 8) & 255) * f, 0, 255) | 0, b = clamp((n & 255) * f, 0, 255) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function fmtKg(kg) {
  if (kg >= 1000) return (kg / 1000).toFixed(kg >= 10000 ? 1 : 2) + ' t';
  if (kg >= 10) return Math.round(kg) + ' kg';
  return kg.toFixed(1) + ' kg';
}
function tierOf(kg) { let t = 0; for (let i = 0; i < TIERS.length; i++) if (kg >= TIERS[i][0]) t = i; return t; }

/* ===================== 캔버스 ===================== */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); resize();

/* ===================== 사운드 ===================== */
let ac = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
}
function beep(f0, f1, dur, type, vol) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

/* ===================== 게임 상태 ===================== */
let state = 'menu';           // menu | play | dead | win
let player, npcs, ores, parts, texts;
let cam = {x: WORLD / 2, y: WORLD / 2, scale: 1, shake: 0};
let eaten = 0, power = 0, oreTimer = 0, time = 0, deadT = 0, curTier = 0;
let best = 0;
try { best = parseFloat(localStorage.getItem('chomprex_best')) || 0; } catch (e) {}

function newGame() {
  player = {x: WORLD / 2, y: WORLD / 2, r: BASE_R, vx: 0, vy: 0, face: 1, phase: 0, mouth: 0, chomp: 0,
            kind: 'rex', col: '#e8552d', dark: shade('#e8552d', 0.68)};
  npcs = []; ores = []; parts = []; texts = [];
  eaten = 0; power = 0; oreTimer = 8; time = 0; deadT = 0; curTier = 0;
  cam.x = player.x; cam.y = player.y; cam.scale = Math.min(W, H) / (player.r * 17); cam.shake = 0;
  for (let i = 0; i < NPC_TARGET; i++) spawnNpc(true);
}
const viewR = () => Math.hypot(W, H) / 2 / cam.scale;
const canEat = n => power > 0 || n.r <= player.r * EAT_RATIO;

function spawnNpc(initial) {
  const vr = viewR();
  // 크기 분포: 대부분 먹잇감, 일부는 비슷한 크기, 일부는 위험한 큰 공룡
  const u = Math.random();
  let f = u < 0.64 ? rnd(0.32, 0.92) : u < 0.76 ? rnd(0.95, 1.07) : rnd(1.22, 2.3);
  const r = Math.max(8, player.r * f);
  let x, y, tries = 0;
  do {
    const a = rnd(0, Math.PI * 2);
    const d = initial ? rnd(player.r * (f > 1.08 ? 13 : 6), vr * 2.2) : rnd(vr * 1.08, vr * 2.1);
    x = player.x + Math.cos(a) * d; y = player.y + Math.sin(a) * d;
  } while ((x < r || y < r || x > WORLD - r || y > WORLD - r) && ++tries < 12);
  if (tries >= 12) return;
  const opts = KINDS.filter(k => r >= k.min);
  const kd = opts[(Math.random() * opts.length) | 0];
  const col = kd.cols[(Math.random() * kd.cols.length) | 0];
  npcs.push({x, y, r, kind: kd.k, col, dark: shade(col, 0.7), ang: rnd(0, 6.28), face: 1, phase: rnd(0, 6),
             wt: 0, wa: rnd(0, 6.28), aggro: Math.random() < 0.65, chaseT: 0, rest: 0, mode: 0});
}
function spawnOre() {
  const vr = viewR();
  for (let t = 0; t < 12; t++) {
    const a = rnd(0, 6.28), d = rnd(vr * 1.2, vr * 2.8);
    const x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
    const r = Math.max(11, player.r * 0.55);
    if (x > r * 2 && y > r * 2 && x < WORLD - r * 2 && y < WORLD - r * 2) { ores.push({x, y, r, t: rnd(0, 6)}); return; }
  }
}
function burst(x, y, r, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(1.5, 5) * r;
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(0.08, 0.2) * r, life: rnd(0.3, 0.6), max: 0.6, col});
  }
}
function grow(e, preyR) { e.r = Math.cbrt(e.r * e.r * e.r + preyR * preyR * preyR); }  // 먹은 만큼 몸무게가 더해짐

/* ===================== 입력 ===================== */
const input = {id: -1, ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0};
const keys = {};
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (input.id !== -1) return;
  input.id = e.pointerId; input.ox = input.x = e.clientX; input.oy = input.y = e.clientY; input.dx = input.dy = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== input.id) return;
  input.x = e.clientX; input.y = e.clientY;
  let dx = input.x - input.ox, dy = input.y - input.oy;
  const len = Math.hypot(dx, dy), R = 56;
  if (len > R) { input.ox = input.x - dx / len * R; input.oy = input.y - dy / len * R; }   // 조이스틱이 손가락을 따라옴
  const m = Math.min(1, len / R);
  if (len > 6) { input.dx = dx / len * m; input.dy = dy / len * m; } else { input.dx = input.dy = 0; }
});
function pointerEnd(e) { if (e.pointerId === input.id) { input.id = -1; input.dx = input.dy = 0; } }
cv.addEventListener('pointerup', pointerEnd); cv.addEventListener('pointercancel', pointerEnd);
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('contextmenu', e => e.preventDefault());

/* ===================== 업데이트 ===================== */
function update(dt) {
  time += dt;
  const live = state === 'play';
  const p = player;

  if (live) {
    let ix = input.dx, iy = input.dy;
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); ix = kx / l; iy = ky / l; }
    const sp = speedOf(p.r) * (power > 0 ? 1.15 : 1);
    const k = 1 - Math.exp(-dt * 9);
    p.vx += (ix * sp - p.vx) * k; p.vy += (iy * sp - p.vy) * k;
    p.x = clamp(p.x + p.vx * dt, p.r, WORLD - p.r); p.y = clamp(p.y + p.vy * dt, p.r, WORLD - p.r);
    if (Math.abs(ix) > 0.12) p.face = ix > 0 ? 1 : -1;
    p.phase += Math.hypot(p.vx, p.vy) * dt / p.r * 2.4;
    if (power > 0) { power -= dt; if (power <= 0) { power = 0; beep(500, 180, 0.3, 'sine', 0.08); } }
    oreTimer -= dt;
    if (oreTimer <= 0) { if (ores.length < 2) spawnOre(); oreTimer = rnd(20, 34); }
  }
  p.chomp = Math.max(0, p.chomp - dt * 4);

  const vr = viewR();
  let nearEd = 1e9;
  for (let i = npcs.length - 1; i >= 0; i--) {
    const n = npcs[i];
    const dx = p.x - n.x, dy = p.y - n.y, d = Math.hypot(dx, dy) || 1;
    // 멀어졌거나 너무 작아진 공룡은 정리
    if (d > vr * 3.2 || (n.r < p.r * 0.2 && d > vr * 1.1)) { npcs.splice(i, 1); continue; }
    const edible = canEat(n);
    let sp = speedOf(n.r) * 0.62, want = n.wa, turn = 2.5, mode = 0;
    n.rest = Math.max(0, n.rest - dt);
    if (live && edible && d < (p.r + n.r) * 3.4) {            // 도망
      want = Math.atan2(-dy, -dx); sp *= 1.3; turn = 6; mode = 1;
    } else if (live && !edible && n.aggro && n.rest <= 0 && d < n.r * 3.5 + p.r * 2) {   // 추격
      want = Math.atan2(dy, dx); sp *= 1.1; turn = 5; mode = 2;
      n.chaseT += dt; if (n.chaseT > 3.5) { n.chaseT = 0; n.rest = 3; }
    } else {                                                  // 배회
      n.wt -= dt; if (n.wt <= 0) { n.wt = rnd(1, 3.5); n.wa = rnd(0, 6.28); }
      sp *= n.rest > 0 ? 0.35 : 0.55;
      n.chaseT = Math.max(0, n.chaseT - dt);
    }
    n.mode = mode;
    const m = n.r * 3;                                        // 맵 가장자리에서는 안쪽으로
    if (n.x < m) want = 0; else if (n.x > WORLD - m) want = Math.PI;
    if (n.y < m) want = Math.PI / 2; else if (n.y > WORLD - m) want = -Math.PI / 2;
    let da = want - n.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
    n.ang += clamp(da, -turn * dt, turn * dt);
    n.x = clamp(n.x + Math.cos(n.ang) * sp * dt, n.r, WORLD - n.r);
    n.y = clamp(n.y + Math.sin(n.ang) * sp * dt, n.r, WORLD - n.r);
    const c = Math.cos(n.ang); if (Math.abs(c) > 0.25) n.face = c > 0 ? 1 : -1;
    n.phase += sp * dt / n.r * 2.4;

    if (!live) continue;
    const touch = Math.max(p.r, n.r) * 0.9 + Math.min(p.r, n.r) * 0.3;
    if (edible) {
      const nd = (d - touch) / p.r; if (nd < nearEd) nearEd = nd;
      if (d < touch) {                                        // 냠!
        const before = kgOf(p.r);
        grow(p, n.r);
        const gain = kgOf(p.r) - before;
        eaten++; p.chomp = 1;
        burst(n.x, n.y, n.r, n.col, 10);
        texts.push({x: n.x, y: n.y - n.r, s: '+' + fmtKg(gain), life: 1, big: n.r > p.r});
        beep(n.r > p.r ? 160 : 320, 70, 0.16, 'square', 0.09);
        npcs.splice(i, 1);
        const t = tierOf(kgOf(p.r));
        if (t > curTier) { curTier = t; toast('성장! ' + TIERS[t][1]); beep(440, 880, 0.35, 'triangle', 0.1); }
        if (kgOf(p.r) >= WIN_KG) { endGame('win'); return; }
      }
    } else if (d < touch) {                                   // 큰 공룡에게 잡아먹힘
      burst(p.x, p.y, p.r, p.col, 22); cam.shake = 0.5;
      grow(n, p.r);
      beep(220, 40, 0.6, 'sawtooth', 0.12);
      endGame('dead'); return;
    }
  }
  p.mouth += ((nearEd < 2.2 || p.chomp > 0 ? 1 : 0) - p.mouth) * (1 - Math.exp(-dt * 12));

  // 공룡끼리도 큰 쪽이 작은 쪽을 잡아먹음
  for (let i = 0; i < npcs.length; i++) {
    const a = npcs[i]; if (!a) continue;
    for (let j = npcs.length - 1; j > i; j--) {
      const b = npcs[j];
      const big = a.r >= b.r ? a : b, small = big === a ? b : a;
      if (big.r < small.r * 1.25) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < big.r * big.r * 0.7) {
        if (big.r < p.r * 2.5) grow(big, small.r * 0.7);
        burst(small.x, small.y, small.r, small.col, 5);
        if (small === a) { npcs[i] = npcs[npcs.length - 1]; npcs.pop(); break; }
        npcs.splice(j, 1);
      }
    }
  }
  let guard = 6;
  while (npcs.length < NPC_TARGET && guard--) spawnNpc(false);

  // 광석
  for (let i = ores.length - 1; i >= 0; i--) {
    const o = ores[i]; o.t += dt;
    const d = Math.hypot(o.x - p.x, o.y - p.y);
    if (d > vr * 7) { ores.splice(i, 1); continue; }
    if (live && d < p.r + o.r) {
      ores.splice(i, 1); power = POWER_TIME;
      burst(o.x, o.y, o.r * 1.5, '#8ff3ff', 18);
      toast('신비의 광석! 큰 공룡도 잡아먹자!');
      beep(520, 1560, 0.45, 'sine', 0.12);
    }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= p.r * 1.6 * dt; if (t.life <= 0) texts.splice(i, 1); }

  // 카메라: 몸이 커질수록 화면이 넓어짐
  const ts = Math.min(W, H) / (p.r * 17);
  cam.scale += (ts - cam.scale) * (1 - Math.exp(-dt * 2.5));
  cam.x = p.x; cam.y = p.y;
  cam.shake = Math.max(0, cam.shake - dt);
}

function endGame(kind) {
  state = kind; deadT = 0;
  const kg = kgOf(player.r);
  if (kg > best) { best = kg; try { localStorage.setItem('chomprex_best', String(best)); } catch (e) {} }
  if (kind === 'win') { beep(523, 1046, 0.7, 'triangle', 0.12); }
  setTimeout(() => showPanel(kind), kind === 'win' ? 500 : 900);
}

/* ===================== 그리기: 공룡 ===================== */
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832); ctx.fill(); }
function leg(x, y0, len, sw, w) {
  ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y0);
  const fx = x + sw * 0.26, fy = y0 + len - Math.abs(sw) * 0.07;
  ctx.lineTo(fx, fy); ctx.lineTo(fx + 0.15, fy); ctx.stroke();
}
function eye(x, y, s) {
  ctx.fillStyle = '#fff'; ell(x, y, s, s);
  ctx.fillStyle = '#111'; ell(x + s * 0.3, y, s * 0.55, s * 0.55);
}
// 단위 좌표(반지름 = 1), 오른쪽을 바라보는 옆모습
function drawDino(d) {
  const s = Math.sin(d.phase), c = d.col, dk = d.dark, k = d.kind;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (k === 'rex' || k === 'raptor' || k === 'para') {
    const rex = k === 'rex', mouth = d.mouth || 0;
    ctx.strokeStyle = dk; leg(-0.14, 0.25, 0.7, -s, 0.2);
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(-0.4, -0.34); ctx.quadraticCurveTo(-1.1, -0.38, -1.7, -0.12 + s * 0.06);
    ctx.quadraticCurveTo(-1.0, 0.12, -0.4, 0.32); ctx.fill();
    ell(0, 0, 0.74, 0.5, -0.2);
    ctx.beginPath(); ctx.moveTo(0.25, -0.36); ctx.lineTo(0.72, -0.82); ctx.lineTo(0.98, -0.4); ctx.lineTo(0.55, 0.08); ctx.fill();
    ctx.fillStyle = dk; ell(-0.25, -0.22, 0.1, 0.07); ell(0.02, -0.3, 0.09, 0.06); ell(-0.5, -0.1, 0.07, 0.05);
    const hx = 0.82, hy = -0.64, hs = rex ? 1.15 : 0.9;
    ctx.save(); ctx.translate(hx, hy); ctx.scale(hs, hs);
    ctx.save(); ctx.translate(-0.12, 0.08); ctx.rotate(mouth * 0.55);     // 아래턱
    ctx.fillStyle = dk; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0.66, 0.02); ctx.lineTo(0.58, 0.16); ctx.lineTo(0, 0.2); ctx.fill();
    if (rex) { ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { const x = 0.26 + i * 0.13; ctx.beginPath(); ctx.moveTo(x, 0.02); ctx.lineTo(x + 0.05, -0.08); ctx.lineTo(x + 0.1, 0.02); ctx.fill(); } }
    ctx.restore();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(-0.28, -0.2); ctx.quadraticCurveTo(0.2, -0.34, 0.58, -0.12);
    ctx.lineTo(0.6, 0.1); ctx.lineTo(-0.22, 0.14); ctx.closePath(); ctx.fill();
    if (rex) { ctx.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { const x = 0.08 + i * 0.13; ctx.beginPath(); ctx.moveTo(x, 0.1); ctx.lineTo(x + 0.05, 0.2); ctx.lineTo(x + 0.1, 0.1); ctx.fill(); } }
    if (k === 'para') { ctx.strokeStyle = c; ctx.lineWidth = 0.13; ctx.beginPath(); ctx.moveTo(-0.1, -0.18); ctx.quadraticCurveTo(-0.5, -0.5, -0.8, -0.3); ctx.stroke(); }
    eye(0.1, -0.1, 0.085);
    ctx.restore();
    ctx.strokeStyle = dk; ctx.lineWidth = 0.08; ctx.beginPath(); ctx.moveTo(0.45, 0.05); ctx.lineTo(0.68, 0.24); ctx.lineTo(0.78, 0.16); ctx.stroke();
    ctx.strokeStyle = c; leg(0.08, 0.25, 0.7, s, 0.23);
    return;
  }
  // 네발 공룡
  const flat = k === 'ankylo', by = flat ? 0.12 : 0, ry = flat ? 0.42 : 0.54;
  ctx.strokeStyle = dk; leg(-0.5, 0.3, 0.65, -s, 0.2); leg(0.52, 0.3, 0.65, s, 0.2);
  ctx.fillStyle = c;
  const tl = k === 'sauro' ? -2.0 : -1.6;
  ctx.beginPath(); ctx.moveTo(-0.6, by - 0.3); ctx.quadraticCurveTo(-1.2, by - 0.1, tl, by + 0.15 + s * 0.05);
  ctx.quadraticCurveTo(-1.1, by + 0.25, -0.6, by + 0.35); ctx.fill();
  if (k === 'stego') {
    ctx.fillStyle = shade(c, 1.3);
    for (let i = 0; i < 5; i++) {
      const x = -0.62 + i * 0.3, y = -0.5 + Math.abs(i - 2) * 0.07, h = 0.4 - Math.abs(i - 2) * 0.07;
      ctx.beginPath(); ctx.moveTo(x - 0.15, y + 0.1); ctx.lineTo(x, y - h); ctx.lineTo(x + 0.15, y + 0.1); ctx.fill();
    }
    ctx.strokeStyle = '#efe6c8'; ctx.lineWidth = 0.06;
    ctx.beginPath(); ctx.moveTo(-1.45, 0.1); ctx.lineTo(-1.6, -0.2); ctx.moveTo(-1.3, 0.05); ctx.lineTo(-1.42, -0.25); ctx.stroke();
    ctx.fillStyle = c;
  }
  if (k === 'ankylo') { ctx.fillStyle = dk; ell(tl + 0.02, by + 0.15, 0.2, 0.16); ctx.fillStyle = c; }
  ell(0, by, 0.95, ry);
  if (k === 'ankylo') {
    ctx.fillStyle = shade(c, 1.3);
    for (let i = 0; i < 6; i++) { const x = -0.7 + i * 0.28; ctx.beginPath(); ctx.moveTo(x - 0.1, by - ry * 0.8); ctx.lineTo(x, by - ry - 0.14); ctx.lineTo(x + 0.1, by - ry * 0.8); ctx.fill(); }
  } else { ctx.fillStyle = dk; ell(-0.3, -0.25, 0.12, 0.07); ell(0.1, -0.3, 0.1, 0.06); ell(-0.6, -0.1, 0.08, 0.05); }
  ctx.fillStyle = c;
  if (k === 'trike') {
    ctx.fillStyle = shade(c, 1.25); ell(0.78, -0.22, 0.4, 0.5, 0.35);
    ctx.fillStyle = c; ell(1.08, 0.08, 0.4, 0.28, 0.25);
    ctx.fillStyle = '#f3ecd2';
    ctx.beginPath(); ctx.moveTo(0.98, -0.12); ctx.lineTo(1.5, -0.55); ctx.lineTo(1.16, -0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(1.34, 0.0); ctx.lineTo(1.56, -0.18); ctx.lineTo(1.44, 0.06); ctx.fill();
    eye(1.12, 0.02, 0.07);
  } else if (k === 'sauro') {
    ctx.strokeStyle = c; ctx.lineWidth = 0.3; ctx.beginPath(); ctx.moveTo(0.7, -0.2); ctx.quadraticCurveTo(1.15, -0.6, 1.3, -1.5); ctx.stroke();
    ell(1.42, -1.56, 0.26, 0.16, 0.2); eye(1.5, -1.6, 0.055);
  } else {
    const hy = flat ? 0.2 : 0.22;
    ctx.beginPath(); ctx.moveTo(0.7, by - 0.25); ctx.lineTo(1.1, hy - 0.12); ctx.lineTo(1.1, hy + 0.14); ctx.lineTo(0.7, by + 0.3); ctx.fill();
    ell(1.15, hy, 0.27, 0.18); eye(1.24, hy - 0.05, 0.06);

}
function drawEntity(e, isPlayer) {
  const sx = (e.x - cam.x) * cam.scale + W / 2, sy = (e.y - cam.y) * cam.scale + H / 2, pr = e.r * cam.scale;
  if (sx < -pr * 2.5 || sx > W + pr * 2.5 || sy < -pr * 2.5 || sy > H + pr * 2.5) return;
  // 발밑 표시: 초록 = 먹을 수 있음, 빨강 = 위험
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(sx, sy + pr * 0.95, pr * 1.0, pr * 0.26, 0, 0, 6.2832); ctx.fill();
  if (!isPlayer && state === 'play') {
    const ed = canEat(e);
    ctx.strokeStyle = ed ? 'rgba(150,255,120,.75)' : 'rgba(255,70,50,.95)';
    ctx.lineWidth = Math.max(1.5, pr * (ed ? 0.06 : 0.1)); ctx.stroke();
  }
  if (isPlayer && power > 0) {
    const pulse = 1.5 + Math.sin(time * 10) * 0.12, blink = power < 2 && Math.sin(time * 22) > 0 ? 0.25 : 0.6;
    const g = ctx.createRadialGradient(sx, sy, pr * 0.3, sx, sy, pr * pulse * 1.3);
    g.addColorStop(0, 'rgba(120,240,255,' + blink + ')'); g.addColorStop(1, 'rgba(190,120,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, pr * pulse * 1.3, 0, 6.2832); ctx.fill();
  }
  ctx.save(); ctx.translate(sx, sy); ctx.scale(pr * e.face, pr);
  drawDino(e);
  ctx.restore();
  if (!isPlayer && state === 'play' && !canEat(e) && pr > 6) {
    ctx.fillStyle = '#ff4a36'; ctx.font = '900 ' + Math.max(12, pr * 0.5) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', sx, sy - pr * (e.kind === 'sauro' ? 1.9 : 1.15));
  }
}

/* ===================== 그리기: 배경 ===================== */
const LAYERS = [{cell: 2200, p: 0.55, s: 3}, {cell: 700, p: 0.5, s: 2}, {cell: 220, p: 0.45, s: 1}, {cell: 70, p: 0.4, s: 0}];
function drawDecor() {
  const x0 = cam.x - W / 2 / cam.scale, y0 = cam.y - H / 2 / cam.scale, x1 = cam.x + W / 2 / cam.scale, y1 = cam.y + H / 2 / cam.scale;
  for (const L of LAYERS) {
    const px = L.cell * cam.scale;
    if (px < 22) continue;
    ctx.globalAlpha = clamp((px - 22) / 20, 0, 1);
    const ia = Math.max(0, Math.floor(x0 / L.cell) - 1), ib = Math.min(Math.floor(WORLD / L.cell) - 1, Math.floor(x1 / L.cell) + 1);
    const ja = Math.max(0, Math.floor(y0 / L.cell) - 1), jb = Math.min(Math.floor(WORLD / L.cell) - 1, Math.floor(y1 / L.cell) + 1);
    for (let j = ja; j <= jb; j++) for (let i = ia; i <= ib; i++) {
      const h = hash(i, j, L.s);
      if (h > L.p) continue;
      const wx = (i + 0.2 + hash(i, j, L.s + 10) * 0.6) * L.cell, wy = (j + 0.2 + hash(i, j, L.s + 20) * 0.6) * L.cell;
      const sx = (wx - cam.x) * cam.scale + W / 2, sy = (wy - cam.y) * cam.scale + H / 2, u = px * (0.16 + h / L.p * 0.1);
      if (L.s === 3) {                      // 흙바닥 공터
        ctx.fillStyle = '#86b866'; ctx.beginPath(); ctx.ellipse(sx, sy, u * 1.9, u * 1.15, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#c2b27a'; ctx.beginPath(); ctx.ellipse(sx, sy, u * 1.6, u * 0.92, 0, 0, 6.2832); ctx.fill();
      } else if (L.s === 2) {
        if (h < L.p * 0.6) {                // 나무
          ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(sx, sy + u * 0.9, u * 0.9, u * 0.3, 0, 0, 6.2832); ctx.fill();
          ctx.fillStyle = '#6b4a2b'; ctx.fillRect(sx - u * 0.12, sy, u * 0.24, u * 0.9);
          ctx.fillStyle = '#2f7a3a'; ctx.beginPath(); ctx.arc(sx, sy - u * 0.2, u * 0.75, 0, 6.2832); ctx.fill();
          ctx.fillStyle = '#3e9447'; ctx.beginPath(); ctx.arc(sx - u * 0.2, sy - u * 0.4, u * 0.45, 0, 6.2832); ctx.fill();
        } else {                            // 바위
          ctx.fillStyle = '#8b8f86'; ctx.beginPath(); ctx.moveTo(sx - u, sy + u * 0.5); ctx.lineTo(sx - u * 0.5, sy - u * 0.5);
          ctx.lineTo(sx + u * 0.4, sy - u * 0.6); ctx.lineTo(sx + u, sy + u * 0.5); ctx.fill();
          ctx.fillStyle = '#a5a9a0'; ctx.beginPath(); ctx.moveTo(sx - u * 0.5, sy - u * 0.5); ctx.lineTo(sx + u * 0.4, sy - u * 0.6); ctx.lineTo(sx, sy + u * 0.1); ctx.fill();
        }
      } else if (L.s === 1) {               // 양치식물
        ctx.strokeStyle = '#2f8a3c'; ctx.lineWidth = Math.max(1.5, u * 0.16); ctx.lineCap = 'round';
        ctx.beginPath();
        for (let q = -2; q <= 2; q++) { ctx.moveTo(sx, sy + u * 0.5); ctx.quadraticCurveTo(sx + q * u * 0.3, sy - u * 0.4, sx + q * u * 0.6, sy - u * 0.2 + Math.abs(q) * u * 0.2); }
        ctx.stroke();
      } else {                              // 풀
        ctx.strokeStyle = '#4c9a45'; ctx.lineWidth = Math.max(1, u * 0.14); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx - u * 0.3, sy); ctx.lineTo(sx - u * 0.45, sy - u * 0.6); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - u * 0.8);
        ctx.moveTo(sx + u * 0.3, sy); ctx.lineTo(sx + u * 0.45, sy - u * 0.6); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
}
function drawOre(o) {
  const sx = (o.x - cam.x) * cam.scale + W / 2, sy = (o.y - cam.y) * cam.scale + H / 2, pr = Math.max(7, o.r * cam.scale);
  if (sx < -pr * 4 || sx > W + pr * 4 || sy < -pr * 4 || sy > H + pr * 4) return false;
  const pulse = 1 + Math.sin(o.t * 4) * 0.15;
  const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, pr * 3 * pulse);
  g.addColorStop(0, 'rgba(140,245,255,.75)'); g.addColorStop(1, 'rgba(170,120,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, pr * 3 * pulse, 0, 6.2832); ctx.fill();
  const bob = Math.sin(o.t * 2.5) * pr * 0.15;
  ctx.fillStyle = '#3fd9f5'; ctx.beginPath(); ctx.moveTo(sx, sy - pr * 1.3 + bob); ctx.lineTo(sx + pr * 0.8, sy - pr * 0.2 + bob);
  ctx.lineTo(sx, sy + pr * 1.1 + bob); ctx.lineTo(sx - pr * 0.8, sy - pr * 0.2 + bob); ctx.fill();
  ctx.fillStyle = '#b9f8ff'; ctx.beginPath(); ctx.moveTo(sx, sy - pr * 1.3 + bob); ctx.lineTo(sx + pr * 0.8, sy - pr * 0.2 + bob); ctx.lineTo(sx, sy - pr * 0.05 + bob); ctx.fill();
  ctx.fillStyle = '#a77bff'; ctx.beginPath(); ctx.moveTo(sx, sy + pr * 1.1 + bob); ctx.lineTo(sx - pr * 0.8, sy - pr * 0.2 + bob); ctx.lineTo(sx, sy - pr * 0.05 + bob); ctx.fill();
  return true;
}

/* ===================== 렌더 ===================== */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#1d6fa5'; ctx.fillRect(0, 0, W, H);                       // 바다
  ctx.save();
  if (cam.shake > 0) ctx.translate(rnd(-1, 1) * cam.shake * 24, rnd(-1, 1) * cam.shake * 24);
  const lx = (0 - cam.x) * cam.scale + W / 2, ly = (0 - cam.y) * cam.scale + H / 2, ls = WORLD * cam.scale, b = 60 * cam.scale + 6;
  ctx.fillStyle = '#e2cf93'; ctx.fillRect(lx - b, ly - b, ls + b * 2, ls + b * 2);  // 모래사장
  ctx.fillStyle = '#7bb661'; ctx.fillRect(lx, ly, ls, ls);                    // 초원
  drawDecor();
  let oreSeen = false;
  for (const o of ores) if (drawOre(o)) oreSeen = true;

  const list = npcs.slice();
  if (state !== 'dead') list.push(player);
  list.sort((a, c) => (a.y + a.r) - (c.y + c.r));
  for (const e of list) drawEntity(e, e === player);

  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc((q.x - cam.x) * cam.scale + W / 2, (q.y - cam.y) * cam.scale + H / 2, Math.max(1, q.r * cam.scale), 0, 6.2832); ctx.fill();
  }
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.life * 2, 0, 1);
    ctx.font = '800 ' + (t.big ? 24 : 16) + 'px sans-serif';
    const x = (t.x - cam.x) * cam.scale + W / 2, y = (t.y - cam.y) * cam.scale + H / 2;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t.s, x, y);
    ctx.fillStyle = t.big ? '#8ff3ff' : '#fff7b0'; ctx.fillText(t.s, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'play') {
    // 화면 밖 광석 방향 표시
    if (!oreSeen && ores.length && power <= 0) {
      let o = ores[0]; for (const q of ores) if (Math.hypot(q.x - player.x, q.y - player.y) < Math.hypot(o.x - player.x, o.y - player.y)) o = q;
      const a = Math.atan2(o.y - player.y, o.x - player.x), m = 34;
      const k = Math.min((W / 2 - m) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - m) / Math.abs(Math.sin(a) || 1e-6));
      const x = W / 2 + Math.cos(a) * k, y = H / 2 + Math.sin(a) * k, pu = 1 + Math.sin(time * 6) * 0.15;
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(pu, pu);
      ctx.fillStyle = 'rgba(80,230,255,.95)'; ctx.strokeStyle = 'rgba(0,40,70,.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -10); ctx.lineTo(-1, 0); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // 가상 조이스틱
    if (input.id !== -1) {
      ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(input.ox, input.oy, 56, 0, 6.2832); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(input.ox + input.dx * 56, input.oy + input.dy * 56, 24, 0, 6.2832); ctx.fill();
    }
  }
}

/* ===================== HUD / 패널 ===================== */
const $ = id => document.getElementById(id);
let toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 1600); }
function updateHud() {
  const show = state !== 'menu';
  $('hud').style.display = show ? 'block' : 'none';
  if (!show) return;
  const kg = kgOf(player.r), t = tierOf(kg);
  $('species').textContent = TIERS[t][1];
  $('weight').textContent = '몸무게 ' + fmtKg(kg);
  $('goalFill').style.width = clamp(Math.log(kg / BASE_KG) / Math.log(WIN_KG / BASE_KG) * 100, 0, 100) + '%';
  $('count').textContent = '잡아먹은 공룡 ' + eaten;
  $('best').textContent = '최고 ' + fmtKg(Math.max(best, kg));
  $('powerWrap').style.display = power > 0 ? 'block' : 'none';
  if (power > 0) $('powerFill').style.width = (power / POWER_TIME * 100) + '%';
}
function showPanel(kind) {
  const kg = player ? kgOf(player.r) : 0;
  let h;
  if (kind === 'menu') {
    h = '<h1>🦖 ChompRex</h1><h2>먹고, 자라고, 최강의 공룡이 되자!</h2><ul>' +
        '<li>화면을 <b>드래그</b>해서 공룡을 움직이세요.</li>' +
        '<li>나보다 <span class="g">작거나 비슷한 공룡(초록 표시)</span>을 잡아먹으면 그만큼 몸이 커집니다.</li>' +
        '<li>나보다 <span class="r">큰 공룡(빨강 표시 !)</span>은 피하세요. 잡아먹힙니다!</li>' +
        '<li>드물게 나타나는 <span class="c">신비의 광석 ◆</span>을 먹으면 ' + POWER_TIME + '초 동안 큰 공룡도 잡아먹을 수 있습니다.</li>' +
        '<li>몸무게 ' + fmtKg(WIN_KG) + '의 대왕 티라노사우루스가 되면 승리!</li></ul>' +
        '<button id="btn">게임 시작</button>';
  } else if (kind === 'dead') {
    h = '<h1>잡아먹혔다!</h1><div class="res">' + TIERS[tierOf(kg)][1] + ' · <b>' + fmtKg(kg) + '</b><br>잡아먹은 공룡 ' + eaten +
        '마리<br>최고 기록 ' + fmtKg(best) + '</div><button id="btn">다시 도전</button>';
  } else {
    h = '<h1>👑 공룡의 왕!</h1><div class="res">몸무게 <b>' + fmtKg(kg) + '</b>의 대왕 티라노사우루스가 되었습니다.<br>잡아먹은 공룡 ' + eaten +
        '마리 · ' + Math.round(time) + '초</div><button id="btn">다시 하기</button>';
  }
  $('panel').innerHTML = h;
  $('overlay').style.display = 'flex';
  $('btn').addEventListener('click', () => { initAudio(); $('overlay').style.display = 'none'; newGame(); state = 'play'; });
}

/* ===================== 루프 ===================== */
let last = 0, hudTick = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (state === 'dead' || state === 'win') deadT += dt;
  update(dt);
  render();
  if (++hudTick % 5 === 0) updateHud();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });
newGame();
showPanel('menu');
updateHud();
requestAnimationFrame(frame);
window.__game = {get state() { return state; }, get player() { return player; }, get npcs() { return npcs; }, get ores() { return ores; },
  get power() { return power; }, input, kgOf, spawnOre, canEat};
</script>
